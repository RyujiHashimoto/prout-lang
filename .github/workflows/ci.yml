name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Installed commands
        run: |
          set -eu
          venv="${RUNNER_TEMP}/etsah-install"
          work="${RUNNER_TEMP}/etsah-install-work"
          rm -rf "$venv" "$work"
          python3 -m venv "$venv"
          # Stay outside the checkout so the commands cannot import the
          # working tree. A missing module or data file fails here.
          (
            cd "$RUNNER_TEMP"
            "$venv/bin/pip" install "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/etsah-pip.txt" 2>&1
          )
          if grep -q "Package would be ignored" "$RUNNER_TEMP/etsah-pip.txt"; then
            echo "setuptools left pattern data out of the package list"
            cat "$RUNNER_TEMP/etsah-pip.txt"
            exit 1
          fi
          "$venv/bin/python" - <<'PY'
          import etsah_patterns.staffing_rules as rules
          assert rules.__name__ == "etsah_patterns.staffing_rules", rules.__name__
          PY
          shop="$("$venv/bin/python" -c 'import etsah_patterns, pathlib; print(pathlib.Path(etsah_patterns.__file__).resolve().parent / "examples" / "shop.etsah")')"
          staff="$("$venv/bin/python" -c 'import etsah_patterns, pathlib; print(pathlib.Path(etsah_patterns.__file__).resolve().parent / "examples" / "staffing.etsah")')"
          test -s "$shop"
          test -s "$staff"
          mkdir -p "$work"
          (
            cd "$work"
            "$venv/bin/etsah" check "$GITHUB_WORKSPACE/examples/refund_fixed.etsah"
            "$venv/bin/etsahc" build "$shop" --out "$work/etsahc-shop"
            "$venv/bin/etsahc" build "$staff" --out "$work/etsahc-staff"
            "$venv/bin/etsahc" find "申請 承認" >"$work/find.out"
            "$venv/bin/etsah-mcp" --help >"$work/etsah-mcp.out"
            "$venv/bin/etsah-mcp" </dev/null
            "$venv/bin/prout" check "$GITHUB_WORKSPACE/examples/refund_fixed.etsah" \
              >"$work/prout.out" 2>"$work/prout.err"
            "$venv/bin/proutc" build "$shop" --out "$work/proutc-shop" \
              >"$work/proutc.out" 2>"$work/proutc.err"
            "$venv/bin/prout-mcp" --help >"$work/prout-mcp.out" 2>"$work/prout-mcp.err"
            "$venv/bin/prout-mcp" </dev/null >"$work/prout-mcp-stdio.out" 2>"$work/prout-mcp-stdio.err"
          )
          grep -q approval "$work/find.out"
          grep -q etsah-mcp "$work/etsah-mcp.out"
          grep -q "新名称は etsah" "$work/prout.err"
          grep -q "新名称は etsah" "$work/proutc.err"
          grep -q "新名称は etsah" "$work/prout-mcp.err"
          grep -q "新名称は etsah" "$work/prout-mcp-stdio.err"
          grep -q "Etsah check:" "$work/prout.out"
          grep -q "Etsah Patterns:" "$work/proutc.out"
          grep -q "etsah-mcp" "$work/prout-mcp.out"
          # The deprecation warning stays on stderr.
          if grep -q "新名称は etsah" "$work/prout.out" "$work/proutc.out" "$work/prout-mcp.out"; then
            echo "deprecation warning leaked to stdout"
            exit 1
          fi

      - name: Action accepts a valid contract
        id: etsah-action-pass
        uses: ./
        with:
          glob: examples/ai_tasks.etsah
          scope: all

      - name: Valid contract reported no errors
        run: |
          set -eu
          test "${{ steps.etsah-action-pass.outputs.errors }}" = "0"
          test "${{ steps.etsah-action-pass.outputs.warnings }}" = "0"
          test "${{ steps.etsah-action-pass.outputs.checked }}" = "examples/ai_tasks.etsah"
          test -z "${{ steps.etsah-action-pass.outputs.error-codes }}"

      - name: Action rejects a broken contract
        id: etsah-action-fail
        continue-on-error: true
        uses: ./
        with:
          glob: examples/ai_tasks_broken.etsah
          scope: all

      - name: Broken contract failed with E-POLICY
        run: |
          set -eu
          if [ "${{ steps.etsah-action-fail.outcome }}" != "failure" ]; then
            echo "broken example unexpectedly passed"
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "etsah-check.json")
          data = json.load(open(path, encoding="utf-8"))
          if data.get("glob") != "examples/ai_tasks_broken.etsah":
              raise SystemExit(f"unexpected result file: {data.get('glob')!r}")
          codes = sorted({item["code"] for item in data["diagnostics"] if item["severity"] == "error"})
          if "E-POLICY" not in codes:
              raise SystemExit(f"expected E-POLICY, got {codes}")
          if data["errors"] < 1:
              raise SystemExit("expected the broken example to fail")
          if data["files"] != ["examples/ai_tasks_broken.etsah"]:
              raise SystemExit(f"checked the wrong files: {data['files']}")
          print(f"broken example failed with {data['errors']} error(s): {', '.join(codes)}")
          PY

      - name: Contract language
        run: |
          python3 etsah.py check examples/refund_fixed.etsah
          python3 etsah.py check examples/staffing.etsah
          python3 etsah.py check examples/staffing_dates.etsah
          python3 etsah.py check examples/templates/timesheet.etsah
          python3 etsah.py check examples/templates/timesheet_filled.etsah
          python3 etsah.py check examples/templates/assignment.etsah
          python3 etsah.py check examples/templates/assignment_filled.etsah
          python3 etsah.py check examples/templates/bill_rate.etsah
          python3 etsah.py check examples/templates/bill_rate_filled.etsah
          python3 etsah.py check examples/ai_tasks.etsah
          python3 etsah.py check examples/agents/support_reply.etsah
          python3 etsah.py check examples/agents/invoice.etsah
          python3 etsah.py check examples/agents/subscription_cancel.etsah
          python3 etsah.py check examples/agents/github_triage.etsah --allow-net github
          python3 etsah.py import mcp examples/agents/tools/mcp_tools.json | diff -u examples/agents/tools/mcp_tools.etsah -
          python3 etsah.py import openai examples/agents/tools/openai_tools.json | diff -u examples/agents/tools/openai_tools.etsah -
          python3 render.py
          test -s human-view.html
          git diff --exit-code -- human-view.html

      - name: Broken example must fail
        run: |
          if python3 etsah.py check examples/refund_broken.etsah; then
            echo "broken example unexpectedly passed"
            exit 1
          fi
          if python3 etsah.py check examples/staffing_broken.etsah > /tmp/staffing-contract.txt 2>&1; then
            echo "broken staffing contract unexpectedly passed"
            exit 1
          fi
          grep -q "1500 >= 1800" /tmp/staffing-contract.txt
          grep -q "21641 <= 21640" /tmp/staffing-contract.txt
          grep -q "false == true" /tmp/staffing-contract.txt
          if python3 etsah.py check examples/staffing_dates_broken.etsah > /tmp/staffing-dates.txt 2>&1; then
            echo "broken staffing date contract unexpectedly passed"
            exit 1
          fi
          grep -q "1500.5 >= 1800.50" /tmp/staffing-dates.txt
          grep -q "2029-04-02 <= 2029-04-01" /tmp/staffing-dates.txt
          grep -q "false == true" /tmp/staffing-dates.txt
          if python3 etsah.py check examples/ai_tasks_broken.etsah > /tmp/ai-tasks.txt 2>&1; then
            echo "broken ai task contract unexpectedly passed"
            exit 1
          fi
          grep -q "emit to an external party has no approval gate" /tmp/ai-tasks.txt
          grep -q "net to an external party has no approval gate" /tmp/ai-tasks.txt
          grep -q "spend has no approval gate" /tmp/ai-tasks.txt
          grep -q "a contract change has no approval gate" /tmp/ai-tasks.txt
          grep -q "5000 <= 1000" /tmp/ai-tasks.txt
          grep -q "retries must be from 0 through 5" /tmp/ai-tasks.txt
          grep -q "escalation path produces external effects" /tmp/ai-tasks.txt
          if python3 etsah.py check examples/agents/support_reply_broken.etsah > /tmp/support-reply.txt 2>&1; then
            echo "broken support reply unexpectedly passed"
            exit 1
          fi
          grep -q "emit to an external party has no approval gate" /tmp/support-reply.txt
          if python3 etsah.py check examples/agents/invoice_broken.etsah > /tmp/invoice.txt 2>&1; then
            echo "broken invoice unexpectedly passed"
            exit 1
          fi
          grep -q "spend has no approval gate" /tmp/invoice.txt
          if python3 etsah.py check examples/agents/subscription_cancel_broken.etsah > /tmp/subscription.txt 2>&1; then
            echo "broken subscription cancellation unexpectedly passed"
            exit 1
          fi
          grep -q "a contract change has no approval gate" /tmp/subscription.txt
          if python3 etsah.py check examples/agents/github_triage_broken.etsah --allow-net github > /tmp/github-triage.txt 2>&1; then
            echo "broken github triage unexpectedly passed"
            exit 1
          fi
          grep -q "network target 'gist' is not allowed by policy" /tmp/github-triage.txt
          grep -q "net effect needs a positive hourly rate limit" /tmp/github-triage.txt

      - name: Information flow
        run: |
          python3 etsah.py check examples/information_flow_safe.etsah \
            --allow-net email --allow-net analytics
          if python3 etsah.py check examples/information_flow_leak.etsah \
            --allow-net email --allow-net analytics > /tmp/iflow-leak.txt 2>&1; then
            echo "leaking example unexpectedly passed"
            exit 1
          fi
          grep -q "E-IFLOW-ARG" /tmp/iflow-leak.txt
          grep -q "track_event" /tmp/iflow-leak.txt
          python3 etsah.py check examples/implicit_flow_safe.etsah --allow-net email
          if python3 etsah.py check examples/implicit_flow_leak.etsah \
            --allow-net email > /tmp/implicit-leak.txt 2>&1; then
            echo "implicit flow leak unexpectedly passed"
            exit 1
          fi
          grep -q "E-IFLOW-RET" /tmp/implicit-leak.txt
          grep -q "classify" /tmp/implicit-leak.txt
          python3 etsah.py check examples/prompt_injection_safe.etsah
          if python3 etsah.py check examples/prompt_injection_leak.etsah > /tmp/injection-leak.txt 2>&1; then
            echo "prompt injection leak unexpectedly passed"
            exit 1
          fi
          grep -q "E-IFLOW-ARG" /tmp/injection-leak.txt
          grep -q "mail.forward" /tmp/injection-leak.txt
          python3 etsah.py check examples/combined_policy_safe.etsah --allow-net email
          if python3 etsah.py check examples/combined_policy_broken.etsah --allow-net email > /tmp/combined-policy.txt 2>&1; then
            echo "combined policy example unexpectedly passed"
            exit 1
          fi
          grep -q "E-POLICY" /tmp/combined-policy.txt
          grep -q "has no approval gate" /tmp/combined-policy.txt

      - name: Deny net overrides allow net
        run: |
          if python3 etsah.py check examples/lantern_status.etsah > /tmp/lantern-bare.txt 2>&1; then
            echo "bare lantern check unexpectedly passed"
            exit 1
          fi
          grep -q "network target 'lantern' is not allowed by policy" /tmp/lantern-bare.txt
          python3 etsah.py check examples/lantern_status.etsah --allow-net lantern
          if python3 etsah.py check examples/lantern_status.etsah --allow-net lantern --deny-net lantern > /tmp/lantern-deny.txt 2>&1; then
            echo "denied lantern check unexpectedly passed"
            exit 1
          fi
          grep -q "network target 'lantern' is denied by policy" /tmp/lantern-deny.txt

      - name: Pattern registry
        working-directory: patterns
        run: |
          python3 etsahc.py index
          git diff --exit-code registry/index.json
          python3 etsahc.py find "申請 承認" | grep -q approval
          python3 etsahc.py build examples/shop.etsah
          python3 etsahc.py build examples/expense.etsah
          python3 etsahc.py build bench/pc_lending.etsah
          python3 etsahc.py build examples/staffing.etsah
          python3 etsahc.py build examples/staffing_desk.etsah
          python3 etsahc.py find "勤怠" | grep -q timesheet
          python3 etsahc.py find "抵触日" | grep -q dispatch_contract
          if python3 etsahc.py build examples/staffing_broken.etsah > /tmp/staffing-pattern.txt 2>&1; then
            echo "broken staffing spec unexpectedly passed"
            exit 1
          fi
          grep -q "抵触日" /tmp/staffing-pattern.txt
          grep -q "approver" /tmp/staffing-pattern.txt
          grep -q "bill rate is below pay rate" /tmp/staffing-pattern.txt
          python3 etsahc.py build examples/ai_automation.etsah
          python3 etsahc.py build examples/ai_desk.etsah
          python3 etsahc.py find "自動化" | grep -q ai_task
          python3 etsahc.py find "承認ゲート" | grep -q approval_gate
          if python3 etsahc.py build examples/ai_automation_broken.etsah > /tmp/ai-automation.txt 2>&1; then
            echo "broken ai automation spec unexpectedly passed"
            exit 1
          fi
          grep -q "emit to an external party has no approval gate" /tmp/ai-automation.txt
          grep -q "5000 <= 1000" /tmp/ai-automation.txt
          grep -q "a contract change has no approval gate" /tmp/ai-automation.txt

      - name: Pattern information flow
        working-directory: patterns
        run: |
          python3 etsahc.py build examples/data_policy.etsah --out /tmp/data-policy
          python3 - <<'PY'
          import json
          security = json.load(open("/tmp/data-policy/security.json", encoding="utf-8"))
          assert security["schema_version"] == 1
          assert security["verified"] is True
          assert "pii" in security["labels"]
          assert "no pii to emit(audit)" in security["guarantees"]
          assert any("custom reimburse" in item for item in security["unresolved"])
          report = open("/tmp/data-policy/report.html", encoding="utf-8").read()
          assert "情報フロー" in report
          assert "notify(manager)" in report
          PY
          if python3 etsahc.py build examples/data_policy_leak.etsah --out /tmp/data-policy-leak > /tmp/data-policy-leak.txt 2>&1; then
            echo "data policy leak unexpectedly passed"
            exit 1
          fi
          grep -q "E-POLICY" /tmp/data-policy-leak.txt
          python3 - <<'PY'
          import json
          security = json.load(open("/tmp/data-policy-leak/security.json", encoding="utf-8"))
          assert security["verified"] is False
          assert security["guarantees"] == []
          PY

      - name: Build service desk examples
        working-directory: patterns
        run: |
          python3 etsahc.py build examples/repair_desk.etsah
          python3 etsahc.py build examples/support_desk.etsah

      - name: Benchmark
        working-directory: patterns
        run: |
          python3 etsahc.py bench
          python3 growth_report.py
          test -s build/growth.html

      - name: Benchmark regression guard
        working-directory: patterns
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open("bench/report.json"))
          rows = {r["case"]: r for r in report}
          after = rows["expense_after"]
          before = rows["expense_before"]
          assert after["ai_authored_lines"] < before["ai_authored_lines"], "reuse did not reduce AI lines"
          assert after["reuse_ratio"] > before["reuse_ratio"], "reuse ratio did not improve"
          print(f'{before["ai_authored_lines"]} -> {after["ai_authored_lines"]} lines, {before["reuse_ratio"]}x -> {after["reuse_ratio"]}x')
          PY

      - name: Staffing limits
        working-directory: patterns
        run: |
          python3 etsahc.py build examples/staffing_limits.etsah
          python3 etsahc.py find "36協定" | grep -q overtime_agreement
          if python3 etsahc.py build examples/staffing_limits_broken.etsah > /tmp/staffing-limits.txt 2>&1; then
            echo "broken staffing limits spec unexpectedly passed"
            exit 1
          fi
          grep -q "overtime" /tmp/staffing-limits.txt
          grep -q "抵触日" /tmp/staffing-limits.txt
